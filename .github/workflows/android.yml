name: Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Finds the SDK manager on the build machine (downloads it if missing), accepts licences and adds the packages the app needs.
      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SM="$(command -v sdkmanager || true)"
          [ -z "$SM" ] && SM="$(find "$SDK" /usr/local/lib/android -maxdepth 6 -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SM" ]; then
            echo "sdkmanager not found, downloading command line tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdtools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/cmdtools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$RUNNER_TEMP/cmdtools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SM"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > "$GITHUB_WORKSPACE/android/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Signed with your own upload key when these repository secrets exist; otherwise signed with the debug key so you can still install and test it.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.LS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ls-release.jks"
            echo "LS_KEYSTORE=$RUNNER_TEMP/ls-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and Play Store bundle
        env:
          LS_KEYSTORE_PASSWORD: ${{ secrets.LS_KEYSTORE_PASSWORD }}
          LS_KEY_ALIAS: ${{ secrets.LS_KEY_ALIAS }}
          LS_KEY_PASSWORD: ${{ secrets.LS_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease bundleRelease 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            {
              echo "## Build errors (copy these to Claude)"
              echo '```'
              grep -E '^e: |^w: .*error|What went wrong|Execution failed|Unresolved|Could not' -A1 "$RUNNER_TEMP/build.log" | head -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^e: ' "$RUNNER_TEMP/build.log" | head -20 | while read -r line; do echo "::error::$line"; done
            # The first lines Gradle says went wrong, in one red annotation that shows on the run page.
            WHY="$( { grep -E '^e: |error:|AAPT|What went wrong' -A6 "$RUNNER_TEMP/build.log" | head -40; echo ---; tail -n 25 "$RUNNER_TEMP/build.log"; } | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
            echo "::error title=Gradle build failed::$WHY"
            exit 1
          }

      - name: Show checksum
        run: sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: landlordspaces-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
